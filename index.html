<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS BLOG — 未来を記録する</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #000000;
    --deep: #080812;
    --card: #0d0d1a;
    --cyan: #00f5ff;
    --purple: #7b2fff;
    --pink: #ff2d9b;
    --white: #ffffff;
    --gray: #8888aa;
    --border: rgba(0,245,255,0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BACKGROUND ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 1.4rem;
    letter-spacing: 0.12em;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo span {
    font-size: 0.55rem;
    font-weight: 400;
    display: block;
    letter-spacing: 0.3em;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: -2px;
  }

  nav { display: flex; gap: 1.5rem; align-items: center; }
  nav a {
    color: var(--gray);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color .2s;
  }
  nav a:hover { color: var(--cyan); }

  .btn-new {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    color: var(--black);
    border: none;
    padding: 0.5rem 1.2rem;
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
    transition: opacity .2s, transform .1s;
  }
  .btn-new:hover { opacity: 0.85; transform: translateY(-1px); }

  /* ── HERO ── */
  .hero {
    position: relative;
    z-index: 1;
    padding: 5rem 2rem 4rem;
    text-align: center;
    overflow: hidden;
  }

  .hero-glow {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    top: -200px; left: 50%; transform: translateX(-50%);
    background: radial-gradient(circle, rgba(123,47,255,0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-eyebrow {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .hero h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 0.05em;
    margin-bottom: 1.2rem;
  }

  .hero h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 50%, var(--pink) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    color: var(--gray);
    font-size: 1rem;
    font-weight: 300;
    max-width: 500px;
    margin: 0 auto 2.5rem;
    line-height: 1.7;
  }

  /* ── MAIN LAYOUT ── */
  .container {
    position: relative; z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  /* ── NEW POST FORM ── */
  .post-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2rem;
    margin-bottom: 3rem;
    display: none;
    animation: slideDown .3s ease;
  }

  .post-form.open { display: block; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .form-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .form-row > * { flex: 1; min-width: 200px; }

  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  input[type="text"], textarea, select {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    padding: 0.7rem 1rem;
    outline: none;
    border-radius: 2px;
    transition: border-color .2s;
  }

  input[type="text"]:focus, textarea:focus, select:focus {
    border-color: var(--cyan);
    background: rgba(0,245,255,0.04);
  }

  textarea { resize: vertical; min-height: 90px; }

  select option { background: #111; }

  .upload-zone {
    border: 1px dashed rgba(0,245,255,0.3);
    border-radius: 4px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    margin-bottom: 1rem;
    position: relative;
    overflow: hidden;
  }

  .upload-zone:hover, .upload-zone.drag { border-color: var(--cyan); background: rgba(0,245,255,0.04); }

  .upload-zone .icon { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
  .upload-zone p { font-size: 0.8rem; color: var(--gray); }
  .upload-zone strong { color: var(--cyan); }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  #preview-area {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .preview-thumb {
    width: 80px; height: 80px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--border);
  }

  .preview-video {
    width: 120px; height: 80px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--border);
  }

  .form-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem; }

  .btn-submit {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    color: var(--black);
    border: none;
    padding: 0.65rem 2rem;
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
    transition: opacity .2s;
  }
  .btn-submit:hover { opacity: 0.85; }

  .btn-cancel {
    background: transparent;
    color: var(--gray);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 0.65rem 1.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 2px;
    transition: color .2s, border-color .2s;
  }
  .btn-cancel:hover { color: var(--white); border-color: var(--white); }

  /* ── POSTS GRID ── */
  .posts-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .section-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-transform: uppercase;
  }

  .filter-tabs { display: flex; gap: 0.5rem; }
  .filter-tab {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--gray);
    padding: 0.35rem 0.9rem;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    border-radius: 2px;
    transition: all .2s;
  }
  .filter-tab.active, .filter-tab:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(0,245,255,0.05);
  }

  .posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
  }

  /* ── POST CARD ── */
  .post-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .25s, transform .25s, box-shadow .25s;
    position: relative;
  }

  .post-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,245,255,0.05), transparent 60%);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 1;
  }

  .post-card:hover {
    border-color: rgba(0,245,255,0.5);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,245,255,0.1), 0 0 0 1px rgba(0,245,255,0.1);
  }
  .post-card:hover::before { opacity: 1; }

  .card-media {
    width: 100%;
    height: 200px;
    overflow: hidden;
    position: relative;
    background: #060610;
  }

  .card-media img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .4s;
    display: block;
  }
  .post-card:hover .card-media img { transform: scale(1.04); }

  .card-media video {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .media-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a0a18, #12122a);
    font-size: 3rem;
    color: rgba(0,245,255,0.2);
  }

  .card-tag {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--border);
    color: var(--cyan);
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.2rem 0.6rem;
    border-radius: 2px;
    z-index: 2;
  }

  .card-body { padding: 1.2rem; }

  .card-date {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .card-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 0.6rem;
    color: var(--white);
  }

  .card-text {
    font-size: 0.82rem;
    color: var(--gray);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 1rem;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 0.8rem;
    margin-top: 0.5rem;
  }

  .card-meta { display: flex; gap: 1rem; }
  .meta-item {
    display: flex; align-items: center; gap: 0.3rem;
    font-size: 0.72rem;
    color: var(--gray);
  }

  .like-btn {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 0.72rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.3rem;
    transition: color .2s;
    padding: 0;
  }
  .like-btn:hover, .like-btn.liked { color: var(--pink); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(8px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    max-width: 720px;
    width: 100%;
    animation: fadeUp .3s ease;
    position: relative;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--gray);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s, border-color .2s;
    z-index: 10;
  }
  .modal-close:hover { color: var(--white); border-color: var(--white); }

  .modal-media {
    width: 100%;
    max-height: 420px;
    overflow: hidden;
    background: #060610;
  }
  .modal-media img {
    width: 100%; max-height: 420px;
    object-fit: contain;
    display: block;
  }
  .modal-media video {
    width: 100%; max-height: 420px;
    display: block;
  }

  .modal-body { padding: 1.5rem 2rem 2rem; }

  .modal-tag-date {
    display: flex; gap: 0.8rem; align-items: center;
    margin-bottom: 0.8rem;
  }

  .modal-tag {
    background: rgba(0,245,255,0.1);
    border: 1px solid rgba(0,245,255,0.25);
    color: var(--cyan);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.2rem 0.7rem;
    border-radius: 2px;
  }

  .modal-date {
    font-size: 0.7rem;
    color: var(--gray);
    letter-spacing: 0.1em;
  }

  .modal-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 1rem;
  }

  .modal-text {
    color: #bbbbd0;
    font-size: 0.9rem;
    line-height: 1.75;
    margin-bottom: 1.5rem;
    white-space: pre-wrap;
  }

  .modal-actions {
    display: flex;
    gap: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  /* ── COMMENTS ── */
  .comments-section { border-top: 1px solid var(--border); padding-top: 1.5rem; }

  .comments-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .comment-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }

  .comment-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 0.9rem 1.1rem;
  }

  .comment-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.4rem;
  }

  .comment-author {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--cyan);
    letter-spacing: 0.05em;
  }

  .comment-time { font-size: 0.65rem; color: var(--gray); }

  .comment-text {
    font-size: 0.82rem;
    color: #bbbbd0;
    line-height: 1.6;
  }

  .comment-form-wrap { display: flex; flex-direction: column; gap: 0.6rem; }
  .comment-form-wrap textarea { min-height: 70px; }
  .comment-row { display: flex; gap: 0.6rem; align-items: flex-end; }
  .comment-row input { flex: 1; }

  .btn-comment {
    background: rgba(0,245,255,0.1);
    border: 1px solid rgba(0,245,255,0.3);
    color: var(--cyan);
    padding: 0.65rem 1.2rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
    white-space: nowrap;
    transition: background .2s;
  }
  .btn-comment:hover { background: rgba(0,245,255,0.18); }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--gray);
  }
  .empty .icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty p { font-size: 0.85rem; line-height: 1.7; }

  /* ── FOOTER ── */
  footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--border);
    padding: 2rem;
    text-align: center;
    color: var(--gray);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
  }

  .footer-logo {
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    nav a { display: none; }
    .posts-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
    .filter-tabs { flex-wrap: wrap; }
    .modal-body { padding: 1rem 1.2rem 1.5rem; }
    .modal-title { font-size: 1rem; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    NEXUS
    <span>FUTURE BLOG</span>
  </div>
  <nav>
    <a href="#" onclick="scrollTop(event)">ホーム</a>
    <a href="#posts">投稿</a>
    <button class="btn-new" onclick="toggleForm()">＋ 新規投稿</button>
  </nav>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-glow"></div>
  <p class="hero-eyebrow">// 未来を記録するブログ</p>
  <h1><em>瞬間を捉え、<br>未来へ届ける。</em></h1>
  <p>写真・動画・言葉で綴る、あなただけの未来の記録。<br>すべての投稿が、時代のアーカイブになる。</p>
</div>

<!-- MAIN CONTAINER -->
<div class="container">

  <!-- NEW POST FORM -->
  <div class="post-form" id="postForm">
    <div class="form-title">// 新規投稿を作成</div>
    <div class="form-row">
      <div>
        <label>タイトル</label>
        <input type="text" id="inputTitle" placeholder="投稿のタイトルを入力...">
      </div>
      <div>
        <label>カテゴリー</label>
        <select id="inputCategory">
          <option value="写真">📷 写真</option>
          <option value="動画">🎬 動画</option>
          <option value="旅行">✈️ 旅行</option>
          <option value="テクノロジー">⚡ テクノロジー</option>
          <option value="自然">🌿 自然</option>
          <option value="アート">🎨 アート</option>
          <option value="日常">🌙 日常</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:1rem">
      <label>本文</label>
      <textarea id="inputBody" placeholder="ここに本文を入力..."></textarea>
    </div>
    <label>メディアをアップロード（画像・動画）</label>
    <div class="upload-zone" id="uploadZone">
      <span class="icon">⬆</span>
      <p><strong>クリックまたはドラッグ</strong>してファイルを追加</p>
      <p style="margin-top:0.3rem;font-size:0.72rem">JPG・PNG・GIF・MP4・MOV 対応</p>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    </div>
    <div id="preview-area"></div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="toggleForm()">キャンセル</button>
      <button class="btn-submit" onclick="submitPost()">投稿する →</button>
    </div>
  </div>

  <!-- POSTS SECTION -->
  <div id="posts">
    <div class="posts-header">
      <div class="section-label">// タイムライン</div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterPosts(this,'all')">すべて</button>
        <button class="filter-tab" onclick="filterPosts(this,'写真')">写真</button>
        <button class="filter-tab" onclick="filterPosts(this,'動画')">動画</button>
        <button class="filter-tab" onclick="filterPosts(this,'旅行')">旅行</button>
        <button class="filter-tab" onclick="filterPosts(this,'テクノロジー')">テクノロジー</button>
      </div>
    </div>
    <div class="posts-grid" id="postsGrid"></div>
    <div class="empty" id="emptyState" style="display:none">
      <div class="icon">🛸</div>
      <p>まだ投稿がありません。<br>「新規投稿」から最初の記録を始めましょう。</p>
    </div>
  </div>

</div>

<!-- POST DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-body">
      <div class="modal-tag-date">
        <span class="modal-tag" id="modalTag"></span>
        <span class="modal-date" id="modalDate"></span>
      </div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-text" id="modalText"></p>
      <div class="modal-actions">
        <button class="like-btn" id="modalLikeBtn" onclick="toggleModalLike()">♡ <span id="modalLikeCount">0</span></button>
        <span class="meta-item">💬 <span id="modalCommentCount">0</span> コメント</span>
      </div>
      <!-- COMMENTS -->
      <div class="comments-section">
        <div class="comments-title">// コメント</div>
        <div class="comment-list" id="commentList"></div>
        <div class="comment-form-wrap">
          <div class="comment-row">
            <input type="text" id="commentAuthor" placeholder="名前（任意）">
          </div>
          <textarea id="commentText" placeholder="コメントを入力..."></textarea>
          <button class="btn-comment" onclick="addComment()">コメントを送信 →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">NEXUS BLOG</div>
  <p>未来を記録するブログ / Built with passion for the cosmos</p>
</footer>

<script>
  // ── STATE ──
  let posts = JSON.parse(localStorage.getItem('nexus_posts') || '[]');
  let currentFilter = 'all';
  let currentPostId = null;
  let pendingFiles = [];

  // ── SAMPLE POSTS ──
  if (posts.length === 0) {
    posts = [
      {
        id: 1,
        title: 'オーロラを求めて — アイスランドの夜',
        category: '旅行',
        body: '凍てつく空気の中、空が突然グリーンとパープルに染まった。\nオーロラは写真では伝えきれない、生命体のような脈動がある。\n次の世代が見る空はどんな色をしているのだろう。',
        mediaType: 'placeholder',
        mediaIcon: '🌌',
        date: '2026.05.12',
        likes: 24,
        liked: false,
        comments: [
          { author: 'Luna', text: '息をのむ美しさですね！いつか行ってみたいです。', time: '2026.05.12' }
        ]
      },
      {
        id: 2,
        title: '都市の光脈 — 夜の東京',
        category: 'テクノロジー',
        body: '高層ビルの間を縫う光の筋。\n都市はひとつの生命体だ、情報と電力が血液のように流れている。\nこの光景が当たり前になる前に記録しておく。',
        mediaType: 'placeholder',
        mediaIcon: '🏙️',
        date: '2026.04.28',
        likes: 31,
        liked: false,
        comments: []
      },
      {
        id: 3,
        title: '深海植物 — 珊瑚礁の記憶',
        category: '自然',
        body: '水深20mで見た、誰にも見られていない珊瑚。\n2050年にはここに何が残っているだろうか。\n美しさに触れるたびに、それを守る責任を感じる。',
        mediaType: 'placeholder',
        mediaIcon: '🪸',
        date: '2026.03.15',
        likes: 18,
        liked: false,
        comments: [
          { author: 'Kai', text: '珊瑚礁の保護について考えさせられます。', time: '2026.03.16' },
          { author: '匿名', text: '写真がとても幻想的です。', time: '2026.03.17' }
        ]
      }
    ];
    save();
  }

  function save() {
    try { localStorage.setItem('nexus_posts', JSON.stringify(posts)); } catch(e) {}
  }

  // ── RENDER ──
  function renderPosts() {
    const grid = document.getElementById('postsGrid');
    const empty = document.getElementById('emptyState');
    const filtered = currentFilter === 'all' ? posts : posts.filter(p => p.category === currentFilter);
    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = filtered.slice().reverse().map(p => `
      <div class="post-card" onclick="openPost(${p.id})">
        <div class="card-media">
          ${renderCardMedia(p)}
          <div class="card-tag">${p.category}</div>
        </div>
        <div class="card-body">
          <div class="card-date">${p.date}</div>
          <div class="card-title">${escHtml(p.title)}</div>
          <div class="card-text">${escHtml(p.body)}</div>
          <div class="card-footer">
            <div class="card-meta">
              <button class="like-btn ${p.liked ? 'liked' : ''}" onclick="toggleLike(event,${p.id})">
                ${p.liked ? '♥' : '♡'} ${p.likes}
              </button>
              <span class="meta-item">💬 ${p.comments.length}</span>
            </div>
            <span style="font-size:0.7rem;color:var(--gray)">詳細 →</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderCardMedia(p) {
    if (p.mediaType === 'image') return `<img src="${p.mediaData}" alt="${escHtml(p.title)}">`;
    if (p.mediaType === 'video') return `<video src="${p.mediaData}" muted loop playsinline></video>`;
    return `<div class="media-placeholder">${p.mediaIcon || '📷'}</div>`;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── FILTER ──
  function filterPosts(btn, cat) {
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = cat;
    renderPosts();
  }

  // ── FORM TOGGLE ──
  function toggleForm() {
    const f = document.getElementById('postForm');
    f.classList.toggle('open');
    if (f.classList.contains('open')) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── FILE UPLOAD ──
  const fileInput = document.getElementById('fileInput');
  const uploadZone = document.getElementById('uploadZone');
  const previewArea = document.getElementById('preview-area');

  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files) {
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        pendingFiles.push({ type: file.type.startsWith('video') ? 'video' : 'image', data: ev.target.result });
        renderPreviews();
      };
      reader.readAsDataURL(file);
    });
  }

  function renderPreviews() {
    previewArea.innerHTML = pendingFiles.map((f,i) =>
      f.type === 'image'
        ? `<img class="preview-thumb" src="${f.data}" title="クリックで削除" onclick="removeFile(${i})">`
        : `<video class="preview-video" src="${f.data}" muted title="クリックで削除" onclick="removeFile(${i})"></video>`
    ).join('');
  }

  function removeFile(i) {
    pendingFiles.splice(i, 1);
    renderPreviews();
  }

  // ── SUBMIT ──
  function submitPost() {
    const title = document.getElementById('inputTitle').value.trim();
    const body  = document.getElementById('inputBody').value.trim();
    const cat   = document.getElementById('inputCategory').value;
    if (!title) { alert('タイトルを入力してください。'); return; }
    const now = new Date();
    const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
    const mediaType = pendingFiles.length ? pendingFiles[0].type : 'placeholder';
    const mediaData = pendingFiles.length ? pendingFiles[0].data : null;
    const icons = { '写真':'📷','動画':'🎬','旅行':'✈️','テクノロジー':'⚡','自然':'🌿','アート':'🎨','日常':'🌙' };
    posts.push({
      id: Date.now(),
      title, body, category: cat,
      mediaType, mediaData,
      mediaIcon: icons[cat] || '📷',
      date: dateStr,
      likes: 0, liked: false, comments: []
    });
    save();
    pendingFiles = [];
    previewArea.innerHTML = '';
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputBody').value = '';
    fileInput.value = '';
    toggleForm();
    renderPosts();
  }

  // ── LIKE ──
  function toggleLike(e, id) {
    e.stopPropagation();
    const p = posts.find(x => x.id === id);
    if (!p) return;
    p.liked = !p.liked;
    p.likes += p.liked ? 1 : -1;
    save();
    renderPosts();
  }

  // ── MODAL ──
  function openPost(id) {
    currentPostId = id;
    const p = posts.find(x => x.id === id);
    if (!p) return;

    // media
    const mm = document.getElementById('modalMedia');
    if (p.mediaType === 'image') {
      mm.innerHTML = `<img src="${p.mediaData}" alt="${escHtml(p.title)}">`;
      mm.style.display = 'block';
    } else if (p.mediaType === 'video') {
      mm.innerHTML = `<video src="${p.mediaData}" controls autoplay muted loop></video>`;
      mm.style.display = 'block';
    } else {
      mm.style.display = 'none';
    }

    document.getElementById('modalTag').textContent = p.category;
    document.getElementById('modalDate').textContent = p.date;
    document.getElementById('modalTitle').textContent = p.title;
    document.getElementById('modalText').textContent = p.body;
    document.getElementById('modalLikeCount').textContent = p.likes;
    const lb = document.getElementById('modalLikeBtn');
    lb.className = 'like-btn' + (p.liked ? ' liked' : '');
    lb.innerHTML = `${p.liked ? '♥' : '♡'} <span id="modalLikeCount">${p.likes}</span>`;

    renderComments(p);
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
    currentPostId = null;
    const mm = document.getElementById('modalMedia');
    mm.innerHTML = '';
  }

  function closeModalOutside(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function toggleModalLike() {
    const p = posts.find(x => x.id === currentPostId);
    if (!p) return;
    p.liked = !p.liked;
    p.likes += p.liked ? 1 : -1;
    save();
    const lb = document.getElementById('modalLikeBtn');
    lb.className = 'like-btn' + (p.liked ? ' liked' : '');
    lb.innerHTML = `${p.liked ? '♥' : '♡'} <span id="modalLikeCount">${p.likes}</span>`;
    renderPosts();
  }

  // ── COMMENTS ──
  function renderComments(p) {
    const list = document.getElementById('commentList');
    document.getElementById('modalCommentCount').textContent = p.comments.length;
    if (p.comments.length === 0) {
      list.innerHTML = `<p style="font-size:0.8rem;color:var(--gray)">まだコメントがありません。最初のコメントを残しましょう。</p>`;
      return;
    }
    list.innerHTML = p.comments.map(c => `
      <div class="comment-item">
        <div class="comment-header">
          <span class="comment-author">${escHtml(c.author || '匿名')}</span>
          <span class="comment-time">${c.time}</span>
        </div>
        <p class="comment-text">${escHtml(c.text)}</p>
      </div>
    `).join('');
  }

  function addComment() {
    const text = document.getElementById('commentText').value.trim();
    if (!text) return;
    const author = document.getElementById('commentAuthor').value.trim() || '匿名';
    const p = posts.find(x => x.id === currentPostId);
    if (!p) return;
    const now = new Date();
    p.comments.push({
      author,
      text,
      time: `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`
    });
    save();
    document.getElementById('commentText').value = '';
    document.getElementById('commentAuthor').value = '';
    renderComments(p);
    renderPosts();
  }

  function scrollTop(e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  // ── INIT ──
  renderPosts();

  // Video hover play
  document.addEventListener('mouseover', e => {
    const v = e.target.closest('.card-media')?.querySelector('video');
    if (v) v.play().catch(()=>{});
  });
  document.addEventListener('mouseout', e => {
    const v = e.target.closest('.card-media')?.querySelector('video');
    if (v) { v.pause(); v.currentTime = 0; }
  });

  // ESC to close modal
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
